version: '3.9'

services:

  # ── PostgreSQL + PostGIS ──────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: safetrail_postgres
    environment:
      POSTGRES_USER:     safetrail
      POSTGRES_PASSWORD: safetrail_pass
      POSTGRES_DB:       safetrail
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safetrail"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MongoDB ───────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: safetrail_mongo
    environment:
      MONGO_INITDB_DATABASE: safetrail
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: safetrail_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: safetrail_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://safetrail:safetrail_pass@postgres:5432/safetrail
      MONGO_URI:    mongodb://mongodb:27017/safetrail
      REDIS_URL:    redis://redis:6379
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      mongodb:  { condition: service_healthy }
      redis:    { condition: service_healthy }
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ── Mock External APIs ────────────────────────────────────────────────────
  mock_apis:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: safetrail_mock_apis
    ports:
      - "9001:9001"
      - "9002:9002"
    volumes:
      - ./backend:/app
    command: python mock_apis.py

  # ── React Admin Dashboard ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: safetrail_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data:
  mongo_data:
  redis_data:
